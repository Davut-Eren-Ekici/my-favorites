<!DOCTYPE html>
<html lang="tr">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>My Favorites Dashboard</title>
   <link rel="stylesheet" href="style.css">
</head>

<body>
   <div class="app-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
         <div class="logo">
            <h2>⭐ Favorites</h2>
         </div>
         <nav class="menu">
            <button id="nav-home" class="menu-btn">
               <span><span>🏠 HOME</span></span>
            </button>
            <button id="nav-add" class="menu-btn">
               <span><span>➕ EKLE / YÖNET</span></span>
            </button>

            <div class="menu-divider">KATEGORİLER</div>
            <div id="dynamic-categories" class="dynamic-menu-list">
               <!-- Kategoriler JS ile dolacak -->
            </div>
         </nav>
      </aside>

      <!-- Ana İçerik Alanı -->
      <main class="main-content hero-container">
         <canvas id="ascii-canvas"></canvas>

         <!-- 1. SAYFA: ANA SAYFA -->
         <section id="page-home">
            <div class="hero-overlay">
               <div>
                  <h1 style="font-size: 2.2rem; font-weight: bold; color: #fff; margin-bottom: 8px;">Favori
                     Koleksiyonunuz</h1>
                  <p style="color: #a6adc8; font-size: 1rem;">Kişisel içeriklerinizi, projelerinizi ve kaynaklarınızı
                     tek bir merkezden organize edin, derecelendirin ve yönetin.</p>
               </div>
            </div>

            <div style="position: relative; z-index: 10; padding: 0 40px 40px 40px;">
               <div class="card-box" style="margin-bottom: 25px;">
                  <h3 style="color: #22d3ee; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;">
                     🔥 En Son Eklenenler
                  </h3>
                  <div id="recent-favorites-list" class="favorites-grid"></div>
               </div>
            </div>
         </section>

         <!-- 2. SAYFA: EKLE / YÖNET -->
         <section id="page-add" style="display: none; position: relative; min-height: 100vh;">
            <div class="winter-landscape-bg">
               <svg viewBox="0 0 1440 600" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
                  <path fill="#082a45" opacity="0.6" d="M0,420 Q360,320 720,400 T1440,380 L1440,600 L0,600 Z"></path>
                  <path fill="#0f3b60" opacity="0.8" d="M0,460 Q480,360 960,450 T1440,430 L1440,600 L0,600 Z"></path>
                  <path fill="#e2e8f0" d="M0,510 Q320,440 640,490 T1440,480 L1440,600 L0,600 Z"></path>
                  <g transform="translate(180, 390) scale(1.1)">
                     <rect x="0" y="40" width="90" height="60" fill="#78350f" rx="3" />
                     <rect x="15" y="55" width="22" height="25" fill="#fef08a" />
                     <rect x="53" y="55" width="22" height="25" fill="#fef08a" />
                     <rect x="37" y="70" width="16" height="30" fill="#451a03" />
                     <polygon points="-10,40 45,0 100,40" fill="#b91c1c" />
                     <path d="M-12,40 Q45,-5 102,40 Q80,32 45,8 Q10,32 -12,40 Z" fill="#ffffff" />
                     <rect x="65" y="10" width="12" height="20" fill="#451a03" />
                     <path d="M65,10 Q71,5 77,10 Z" fill="#ffffff" />
                  </g>
                  <g transform="translate(780, 440) scale(0.95)">
                     <circle cx="40" cy="65" r="28" fill="#ffffff" />
                     <circle cx="40" cy="32" r="20" fill="#ffffff" />
                     <circle cx="40" cy="8" r="14" fill="#ffffff" />
                     <circle cx="35" cy="5" r="2" fill="#000" />
                     <circle cx="45" cy="5" r="2" fill="#000" />
                     <circle cx="40" cy="30" r="2.5" fill="#000" />
                     <circle cx="40" cy="40" r="2.5" fill="#000" />
                     <polygon points="40,8 52,11 40,13" fill="#ea580c" />
                     <rect x="26" y="-6" width="28" height="4" fill="#1e293b" />
                     <rect x="31" y="-20" width="18" height="15" fill="#1e293b" />
                     <rect x="31" y="-8" width="18" height="3" fill="#dc2626" />
                     <line x1="22" y1="30" x2="2" y2="20" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
                     <line x1="58" y1="30" x2="78" y2="18" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
                  </g>
               </svg>
            </div>

            <div class="content-grid" style="position: relative; z-index: 10;">
               <div class="card-box">
                  <h2 style="color: #22d3ee; margin-bottom: 15px;">Favori Ekle / Düzenle</h2>
                  <form id="favorite-form">
                     <div class="form-group">
                        <label for="title">Başlık</label>
                        <input type="text" id="title" required placeholder="Örn: Inception">
                     </div>
                     <div class="form-group">
                        <label for="category">Kategori</label>
                        <input type="text" id="category" required placeholder="Örn: Film, Kitap, Oyun">
                     </div>
                     <div class="form-group">
                        <label for="rating">Puan (1-5)</label>
                        <input type="number" id="rating" min="1" max="5" value="5" required>
                     </div>
                     <div class="form-group">
                        <label for="note">Not</label>
                        <textarea id="note" rows="3" placeholder="İsteğe bağlı not..."></textarea>
                     </div>
                     <button type="submit" id="submit-btn" style="width: 100%; margin-top: 10px;">
                        <span><span>Kaydet</span></span>
                     </button>
                  </form>
               </div>

               <div class="card-box">
                  <h2 style="color: #22d3ee; margin-bottom: 15px;">Tüm Kayıtlar</h2>
                  <div id="favorites-list" class="favorites-grid"></div>
               </div>
            </div>
         </section>

         <!-- 3. SAYFA: KATEGORİ DETAY -->
         <section id="page-category" style="display: none; padding: 40px; position: relative; z-index: 10;">
            <h2 id="category-title" style="color: #22d3ee; margin-bottom: 20px;"></h2>
            <div id="category-favorites-list" class="favorites-grid"></div>
         </section>
      </main>
   </div>

   <script src="script.js"></script>
</body>

</html>

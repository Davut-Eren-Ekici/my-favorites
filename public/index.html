<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout">
        <!-- SOL YAN MENÜ -->
        <aside class="sidebar">
            <div class="logo">
                <h2>⭐ Favorites</h2>
            </div>
            <nav class="menu">
                <button class="menu-btn active" id="nav-home">
                    <span><span>🏠 HOME</span></span>
                </button>
                <button class="menu-btn btn-dark-gray" id="nav-add">
                    <span><span>➕ EKLE / YÖNET</span></span>
                </button>

                <div class="menu-divider">KATEGORİLER</div>
                <div id="dynamic-categories" class="dynamic-menu-list"></div>
            </nav>
        </aside>

        <!-- SAĞ ANA ALAN -->
        <main class="main-content">

            <!-- 1. ANA SAYFA -->
            <div id="page-home" class="page-view active">
                <div class="hero-container">
                    <canvas id="ascii-canvas"></canvas>
                    <div class="hero-overlay">
                        <div class="hero-left">
                            <h1>Hoş Geldiniz 👋</h1>
                            <p>Kişisel favorilerinizi kategorize edin ve puanlayın.</p>
                        </div>
                        <div class="hero-right">
                            <div class="card-box recent-box">
                                <h3>🔥 En Son Eklenenler</h3>
                                <div id="recent-favorites-list" class="recent-grid"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. EKLE / YÖNET SAYFASI -->
            <div id="page-add" class="page-view" style="display: none;">
                <div class="content-grid">
                    <section class="card-box form-box">
                        <form id="favorite-form">
                            <div class="form-group">
                                <label for="category">Kategori Seç / Yaz</label>
                                <input type="text" id="category" placeholder="Örn: Film, Müzik, Hobi" required>
                            </div>
                            <div class="form-group">
                                <label for="title">Başlık</label>
                                <input type="text" id="title" placeholder="Başlık giriniz..." required>
                            </div>
                            <div class="form-group">
                                <label for="rating">Puan (1-5 ⭐)</label>
                                <input type="number" id="rating" min="1" max="5" value="5" required>
                            </div>
                            <div class="form-group">
                                <label for="note">Notlar</label>
                                <textarea id="note" rows="3" placeholder="Not ekleyin..."></textarea>
                            </div>
                            <button type="submit" id="submit-btn"><span><span>Kaydet</span></span></button>
                        </form>
                    </section>

                    <section class="card-box list-box">
                        <h3>Tüm Eklenenler</h3>
                        <div id="favorites-list" class="favorites-grid"></div>
                    </section>
                </div>
            </div>

            <!-- 3. KATEGORİ DETAY SAYFASI -->
            <div id="page-category" class="page-view" style="display: none;">
                <div class="category-header">
                    <h2 id="category-title">Kategori Adı</h2>
                </div>
                <div id="category-favorites-list" class="favorites-grid horizontal-scroll"></div>
            </div>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>My Favorites Dashboard</title>
   <link rel="stylesheet" href="style.css">
</head>

<body>

   <div class="app-layout">
      <!-- SOL YAN MENÜ -->
      <aside class="sidebar">
         <div class="logo">
            <h2>⭐ Favorites</h2>
         </div>
         <nav class="menu">
            <button class="menu-btn active" id="nav-home">
               <span><span>🏠 HOME</span></span>
            </button>
            <button class="menu-btn btn-dark-gray" id="nav-add">
               <span><span>➕ EKLE / YÖNET</span></span>
            </button>

            <div class="menu-divider">KATEGORİLER</div>
            <div id="dynamic-categories" class="dynamic-menu-list"></div>
         </nav>
      </aside>

      <!-- SAĞ ANA ALAN -->
      <main class="main-content">

         <!-- 1. ANA SAYFA -->
         <div id="page-home" class="page-view active">
            <div class="hero-container">
               <canvas id="ascii-canvas"></canvas>
               <div class="hero-overlay">
                  <div class="hero-left">
                     <h1>Favori Koleksiyonunuz</h1>
                     <p>Kişisel içeriklerinizi, projelerinizi ve kaynaklarınızı tek bir merkezden organize edin,
                        derecelendirin ve yönetin.</p>
                  </div>
                  <div class="hero-right">
                     <div class="card-box recent-box">
                        <h3>🔥 En Son Eklenenler</h3>
                        <div id="recent-favorites-list" class="recent-grid"></div>
                     </div>
                  </div>
               </div>
            </div>
         </div>

         <!-- 2. EKLE / YÖNET SAYFASI -->
         <!-- 2. SAYFA: EKLE / YÖNET -->
         <section id="page-add" style="display: none; position: relative; min-height: 100vh;">
            <!-- Karlı Manzara Vektör Arka Planı -->
            <div class="winter-landscape-bg">
               <svg viewBox="0 0 1440 600" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
                  <!-- Karlı Tepeler -->
                  <path fill="#082a45" opacity="0.6" d="M0,420 Q360,320 720,400 T1440,380 L1440,600 L0,600 Z"></path>
                  <path fill="#0f3b60" opacity="0.8" d="M0,460 Q480,360 960,450 T1440,430 L1440,600 L0,600 Z"></path>
                  <path fill="#e2e8f0" d="M0,510 Q320,440 640,490 T1440,480 L1440,600 L0,600 Z"></path>

                  <!-- Karlı Ev -->
                  <g transform="translate(180, 390) scale(1.1)">
                     <!-- Ev Gövdesi -->
                     <rect x="0" y="40" width="90" height="60" fill="#78350f" rx="3" />
                     <rect x="15" y="55" width="22" height="25" fill="#fef08a" /> <!-- Pencere 1 -->
                     <rect x="53" y="55" width="22" height="25" fill="#fef08a" /> <!-- Pencere 2 -->
                     <rect x="37" y="70" width="16" height="30" fill="#451a03" /> <!-- Kapı -->
                     <!-- Çatı -->
                     <polygon points="-10,40 45,0 100,40" fill="#b91c1c" />
                     <!-- Çatı Üstündeki Kar -->
                     <path d="M-12,40 Q45,-5 102,40 Q80,32 45,8 Q10,32 -12,40 Z" fill="#ffffff" />
                     <!-- Baca & Duman -->
                     <rect x="65" y="10" width="12" height="20" fill="#451a03" />
                     <path d="M65,10 Q71,5 77,10 Z" fill="#ffffff" />
                  </g>

                  <!-- Kardan Adam -->
                  <g transform="translate(780, 440) scale(0.95)">
                     <!-- Gövde -->
                     <circle cx="40" cy="65" r="28" fill="#ffffff" />
                     <circle cx="40" cy="32" r="20" fill="#ffffff" />
                     <circle cx="40" cy="8" r="14" fill="#ffffff" />
                     <!-- Gözler ve Düğmeler -->
                     <circle cx="35" cy="5" r="2" fill="#000" />
                     <circle cx="45" cy="5" r="2" fill="#000" />
                     <circle cx="40" cy="30" r="2.5" fill="#000" />
                     <circle cx="40" cy="40" r="2.5" fill="#000" />
                     <!-- Havuç Burun -->
                     <polygon points="40,8 52,11 40,13" fill="#ea580c" />
                     <!-- Şapka -->
                     <rect x="26" y="-6" width="28" height="4" fill="#1e293b" />
                     <rect x="31" y="-20" width="18" height="15" fill="#1e293b" />
                     <rect x="31" y="-8" width="18" height="3" fill="#dc2626" />
                     <!-- Süpürge/Kollar -->
                     <line x1="22" y1="30" x2="2" y2="20" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
                     <line x1="58" y1="30" x2="78" y2="18" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
                  </g>

                  <!-- Oynayan Çocuk Çizimleri (Siluet) -->
                  <g transform="translate(680, 475)">
                     <!-- Çocuk 1 (Kardan adama bakan) -->
                     <circle cx="10" cy="10" r="6" fill="#0284c7" /> <!-- Kafa/Bere -->
                     <path d="M4,16 L16,16 L18,35 L2,35 Z" fill="#0284c7" /> <!-- Mont -->
                     <line x1="6" y1="35" x2="4" y2="48" stroke="#0f172a" stroke-width="3" />
                     <line x1="14" y1="35" x2="16" y2="48" stroke="#0f172a" stroke-width="3" />
                  </g>
                  <g transform="translate(890, 480)">
                     <!-- Çocuk 2 (Kartopu atan) -->
                     <circle cx="10" cy="10" r="6" fill="#e11d48" />
                     <path d="M4,16 L16,16 L18,35 L2,35 Z" fill="#e11d48" />
                     <line x1="6" y1="35" x2="3" y2="46" stroke="#0f172a" stroke-width="3" />
                     <line x1="14" y1="35" x2="17" y2="46" stroke="#0f172a" stroke-width="3" />
                     <circle cx="24" cy="12" r="3" fill="#ffffff" /> <!-- Kartopu -->
                  </g>
               </svg>
            </div>

            <div class="content-grid" style="position: relative; z-index: 10;">
               <div class="card-box">
                  <h2 style="color: #22d3ee; margin-bottom: 15px;">Favori Ekle / Düzenle</h2>
                  <form id="favorite-form">
                     <div class="form-group">
                        <label for="title">Başlık</label>
                        <input type="text" id="title" required placeholder="Örn: Inception">
                     </div>
                     <div class="form-group">
                        <label for="category">Kategori</label>
                        <input type="text" id="category" required placeholder="Örn: Film, Kitap, Oyun">
                     </div>
                     <div class="form-group">
                        <label for="rating">Puan (1-5)</label>
                        <input type="number" id="rating" min="1" max="5" value="5" required>
                     </div>
                     <div class="form-group">
                        <label for="note">Not</label>
                        <textarea id="note" rows="3" placeholder="İsteğe bağlı not..."></textarea>
                     </div>
                     <button type="submit" id="submit-btn" style="width: 100%; margin-top: 10px;">
                        <span><span>Kaydet</span></span>
                     </button>
                  </form>
               </div>

               <div class="card-box">
                  <h2 style="color: #22d3ee; margin-bottom: 15px;">Tüm Kayıtlar</h2>
                  <div id="favorites-list" class="favorites-grid">
                     <!-- Tüm kartlar JS ile dolacak -->
                  </div>
               </div>
            </div>
         </section>

         <section class="card-box list-box">
            <h3>Tüm Eklenenler</h3>
            <div id="favorites-list" class="favorites-grid"></div>
         </section>
   </div>
   </div>

   <!-- 3. KATEGORİ DETAY SAYFASI -->
   <div id="page-category" class="page-view" style="display: none;">
      <div class="category-header">
         <h2 id="category-title">Kategori Adı</h2>
      </div>
      <div id="category-favorites-list" class="favorites-grid horizontal-scroll"></div>
   </div>

   </main>
   </div>

   <script src="script.js"></script>
</body>

</html>
